services:
  redis:
    image: redis:7-alpine
    container_name: shieldflow-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  api:
    build: .
    container_name: shieldflow-api
    command: uvicorn api:app --host 0.0.0.0 --port 8000
    ports:
      - "8000:8000"
    environment:
      - REDIS_HOST=redis
      - REDIS_PORT=6379
    volumes:
      - .:/app
    depends_on:
      redis:
        condition: service_healthy

  dashboard:
    build: .
    container_name: shieldflow-dashboard
    command: streamlit run app.py --server.port 8501 --server.address 0.0.0.0
    ports:
      - "8501:8501"
    environment:
      - FASTAPI_URL=http://api:8000/webhook/evaluate-transaction
      - HISTORY_URL=http://api:8000/ledger/history
      - REVIEW_ACTION_URL=http://api:8000/analyst/review-action
    depends_on:
      - api

volumes:
  redis_data:
